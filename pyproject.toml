[project]
name = "event-booking-notification-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "celery>=5.6.2",
    "docker>=7.1.0",
    "fastapi>=0.135.2",
    "fastapi-mail>=1.6.2",
    "flower>=2.0.1",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.12.1",
    "pymongo>=4.16.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "python-multipart>=0.0.22",
    "redis>=7.4.0",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"


